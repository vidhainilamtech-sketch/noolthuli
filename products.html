<style>
/* Opening animation: saree curtains (inline so it shows instantly) */
#intro{position:fixed;inset:0;z-index:999;display:grid;place-items:center;pointer-events:none}
#intro .il,#intro .ir{position:absolute;top:0;bottom:0;width:50.5%;transition:transform 1.15s cubic-bezier(.75,0,.2,1)}
#intro .il{left:0;background:linear-gradient(90deg,transparent calc(100% - 46px),#7a1530 calc(100% - 46px) calc(100% - 44px),#c99a3c calc(100% - 44px) calc(100% - 30px),transparent calc(100% - 30px) calc(100% - 27px),#b8892f calc(100% - 27px) calc(100% - 24px),transparent 0),repeating-linear-gradient(0deg,rgba(184,137,47,.07) 0 2px,transparent 2px 6px),linear-gradient(90deg,#f3e3c3,#fffdf8 75%)}
#intro .ir{right:0;background:linear-gradient(270deg,transparent calc(100% - 46px),#7a1530 calc(100% - 46px) calc(100% - 44px),#c99a3c calc(100% - 44px) calc(100% - 30px),transparent calc(100% - 30px) calc(100% - 27px),#b8892f calc(100% - 27px) calc(100% - 24px),transparent 0),repeating-linear-gradient(0deg,rgba(184,137,47,.07) 0 2px,transparent 2px 6px),linear-gradient(270deg,#f3e3c3,#fffdf8 75%)}
#intro .ic{position:relative;text-align:center;transition:opacity .45s,transform .6s;padding:0 16px}
#intro .im{width:130px;height:112px;margin:0 auto;animation:inM 1.1s cubic-bezier(.2,.8,.2,1) both}
#intro .it{width:190px;height:44px;margin:12px auto 0;animation:inT .9s .35s both}
#intro svg{display:block;width:230px;height:22px;margin:8px auto 4px}
#intro path{stroke-dasharray:320;stroke-dashoffset:320;animation:inD 1.1s .45s ease forwards}
#intro p{margin:0;font:italic 500 15px/1.4 "Playfair Display",Georgia,serif;color:#85600f;letter-spacing:.04em;animation:inT .9s .7s both}
.intro-done #intro .il{transform:translateX(-101%)}.intro-done #intro .ir{transform:translateX(101%)}
.intro-done #intro .ic{opacity:0;transform:scale(1.08)}
.intro-gone #intro{display:none}
.intro-quick #intro .ic{display:none}.intro-quick #intro .il,.intro-quick #intro .ir{transition-duration:.75s}
@keyframes inM{from{opacity:0;transform:translateY(14px) scale(.8) rotate(-6deg)}}
@keyframes inT{from{opacity:0;transform:translateY(10px)}}
@keyframes inD{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#intro{display:none}}
</style>
<script>
/* Intro: full animation on first visit, quick curtain on later pages. Never blocks more than 2 s. */
(function(h){h.classList.add("js");var q;try{q=sessionStorage.getItem("ntIntro");sessionStorage.setItem("ntIntro","1")}catch(e){}
if(q)h.classList.add("intro-quick");var t0=Date.now(),min=q?120:1500,f=0;
function done(){if(f)return;f=1;h.classList.add("intro-done");setTimeout(function(){h.classList.add("intro-gone")},1250)}
addEventListener("load",function(){setTimeout(done,Math.max(0,min-(Date.now()-t0)))});setTimeout(done,2000)})(document.documentElement);
</script>
